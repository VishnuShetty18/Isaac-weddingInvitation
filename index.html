.links a:hover{color:var(--goldtext)}

.hero h1{font-size:clamp(2.8rem,6.8vw,5.7rem);max-width:760px;margin:1rem 0 .3rem;overflow-wrap:anywhere;text-wrap:balance}.hero>div:last-child{width:min(760px,100%);z-index:1}.hero .script{letter-spacing:.02em}.hero .facts{color:#503749}.hero .btns{justify-content:flex-start}.hero .emblem{display:none}
.script{font:400 clamp(1.6rem,5vw,2.3rem) var(--script);color:var(--goldtext)}
.facts{font-family:var(--serif);font-size:clamp(1.25rem,3.5vw,1.7rem);margin:.8rem 0 1.4rem}
.emblem{width:min(500px,88vw);height:auto;max-height:34vh;object-fit:cover;margin:.5rem auto 0;display:block}.hero-photo{border:1px solid var(--gold);border-radius:18px;box-shadow:0 14px 34px rgba(80,55,73,.22)}
.btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.7rem 1.5rem;border-radius:99px;border:1px solid var(--gold);background:var(--gold);color:#2b1c27;font:600 .95rem var(--sans);text-decoration:none;cursor:pointer;text-align:center;max-width:100%}
.btn.alt{background:var(--card);color:var(--text)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.heart{position:absolute;bottom:-30px;color:var(--gold);opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.5rem;backdrop-filter:blur(8px);box-shadow:0 14px 34px rgba(80,55,73,.12)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;max-width:560px;margin:0 auto}
.cd div{text-align:center;padding:1rem .3rem}
.cd b{display:block;font:600 clamp(1.7rem,7vw,2.8rem)/1 var(--serif);font-variant-numeric:tabular-nums}
.cd span{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.plain{text-align:center;margin-top:.8rem;color:var(--muted);font-size:.92rem}
.scratch{position:relative;max-width:440px;margin:0 auto;aspect-ratio:16/10;border-radius:22px;overflow:hidden;border:1.5px solid var(--gold);box-shadow:0 14px 34px rgba(80,55,73,.18)}
.scratch .under{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:1rem;background:linear-gradient(135deg,var(--blush),var(--peach));color:#503749}
.under h3{font-size:clamp(1.4rem,6vw,2rem)}
.under p{margin:.2rem 0;font-weight:500}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .7s}
.scratch.done canvas{opacity:0;pointer-events:none}
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.hash{font:600 clamp(1.4rem,6vw,2.4rem) var(--serif);text-align:center;overflow-wrap:anywhere;color:var(--goldtext);margin:.5rem 0 1rem}
.center{text-align:center}
.gal{columns:2 200px;gap:.8rem}.gal img{width:100%;border-radius:14px;margin-bottom:.8rem;cursor:pointer;display:block}
.lb{position:fixed;inset:0;background:rgba(20,10,20,.88);display:none;place-items:center;z-index:50;padding:1rem}.lb.on{display:grid}.lb figure{margin:0;text-align:center;color:#fff;max-width:92vw}.lb img{max-width:92vw;max-height:76vh;border-radius:12px}
footer{text-align:center;padding:2.5rem 1.25rem calc(2rem + env(safe-area-inset-bottom,0px));background:linear-gradient(var(--bg),var(--blush))}

footer p{max-width:50ch;margin:.5rem auto 1.2rem;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plum);color:#fff;padding:.7rem 1.2rem;border-radius:99px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.heart{display:none}*{transition:none!important;animation:none!important}}
.ev{padding:0;overflow:hidden;transition:transform .25s}.ev:hover{transform:translateY(-4px)}
.ev .ph{aspect-ratio:16/10;display:grid;place-items:center;font-size:3.4rem;position:relative;background:linear-gradient(135deg,var(--a1),var(--a2));overflow:hidden}
.ev .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ev .bd{padding:1.2rem 1.4rem 1.5rem;border-top:3px solid var(--a3)}
.ev h3{font-size:1.6rem;overflow-wrap:anywhere}
.ev dl{margin:.8rem 0 0;display:grid;gap:.55rem}.ev dt{font-size:.78rem;color:var(--muted)}.ev dd{margin:0;font-weight:500;overflow-wrap:anywhere}.map-link{color:var(--goldtext);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}.map-link:hover{color:var(--plum)}

  evT:"ಮದುವೆಯ ಸಂಭ್ರಮಗಳು",evS:"ಕುಟುಂಬ ಮತ್ತು ಸ್ನೇಹಿತರೊಂದಿಗೆ ನಮ್ಮ ಸಂಭ್ರಮದಲ್ಲಿ ಜೊತೆಯಾಗಿ.",lDate:"ದಿನಾಂಕ",lTime:"ಸಮಯ",lVenue:"ಸ್ಥಳ",lAddr:"ವಿಳಾಸ",lNote:"ಟಿಪ್ಪಣಿ",dir:"ದಾರಿ ತೋರಿಸಿ",
  hT:"ಮದುವೆಯ ಹ್ಯಾಶ್‌ಟ್ಯಾಗ್",copy:"ಹ್ಯಾಶ್‌ಟ್ಯಾಗ್ ನಕಲಿಸಿ",copied:"ನಕಲಿಸಲಾಗಿದೆ!",gT:"ಗ್ಯಾಲರಿ",
  thT:"ಪ್ರೀತಿ ಮತ್ತು ಕೃತಜ್ಞತೆಯೊಂದಿಗೆ",th:"ನಿಮ್ಮ ಆಶೀರ್ವಾದ, ಪ್ರೀತಿ ಮತ್ತು ನಮ್ಮ ಪಯಣದಲ್ಲಿ ಜೊತೆಯಾಗಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದಗಳು. ನಿಮ್ಮೊಂದಿಗೆ ಸಂಭ್ರಮಿಸಲು ಕಾತರರಾಗಿದ್ದೇವೆ.",top:"ಮೇಲಕ್ಕೆ"}
};
let lang="en"; try{lang=localStorage.getItem("lang")||"en"}catch(e){}
if(!T[lang])lang="en";
const $=(s,r=document)=>r.querySelector(s);
const t=k=>T[lang][k]||T.en[k]||"";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=(e,k)=>(lang==="kn"&&e[k+"_kn"])||e[k]||"";
const fmtDate=s=>{const d=new Date((s||"")+"T00:00:00");return isNaN(d)?"":d.toLocaleDateString(lang==="kn"?"kn-IN":"en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
const fmtTime=s=>{const m=/^\s*(\d{1,2}):(\d{2})\s*(AM|PM)\s*$/i.exec(s||"");if(!m)return s||"";const h=+m[1],pm=m[3].toUpperCase()==="PM";if(lang!=="kn")return `${h}:${m[2]} ${m[3].toUpperCase()}`;return `${!pm?"ಬೆಳಿಗ್ಗೆ":(h===12||h<4)?"ಮಧ್ಯಾಹ್ನ":"ಸಂಜೆ"} ${h}:${m[2]}`};
const orn='<svg class="orn" viewBox="0 0 160 14" aria-hidden="true"><path d="M0 7h62M98 7h62" stroke="#C6A15B" stroke-width="1"/><path d="M80 1l5 6-5 6-5-6z" fill="none" stroke="#C6A15B"/><circle cx="68" cy="7" r="2" fill="#C6A15B"/><circle cx="92" cy="7" r="2" fill="#C6A15B"/></svg>';
const emblem="";
const sec=(id,inner)=>`<section id="${id}" aria-labelledby="${id}-h"><div class="wrap">${inner}</div></section>`;
const active=()=>Object.entries(CONFIG.events).filter(([,e])=>e.enabled&&(e.name||e.name_kn));

function card([k,e]){
  const a=ACC[k]||ACC.other,name=f(e,"name");
  const rows=[["lDate",fmtDate(e.date)],["lTime",fmtTime(e.time)],["lVenue",f(e,"venue")],["lAddr",f(e,"address")],["lNote",f(e,"notes")]].filter(r=>r[1]).map(([l,v])=>{const isLocation=l==="lVenue"||l==="lAddr";const link=isLocation&&/^https:\/\//.test(e.mapsUrl||"")?`<a class="map-link" href="${esc(e.mapsUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(v)} — open in Google Maps">${esc(v)} ↗</a>`:esc(v);return `<div><dt>${t(l)}</dt><dd>${link}</dd></div>`}).join("");
  const img=e.illustration?`<img loading="lazy" src="${esc(e.illustration)}" alt="${esc(name)}" onerror="this.remove()">`:"";
  const dir=/^https:\/\//.test(e.mapsUrl||"")?`<a class="btn alt" style="margin-top:1rem" href="${esc(e.mapsUrl)}" target="_blank" rel="noopener">${t("dir")}</a>`:"";
  return `<article class="card ev" id="${k}" style="--a1:${a[0]};--a2:${a[1]};--a3:${a[2]}"><div class="ph"><span aria-hidden="true">${a[3]}</span>${img}</div><div class="bd"><h3>${esc(name)}</h3><dl>${rows}</dl>${dir}</div></article>`;
}
function build(){
  const nm=esc(CONFIG.coupleNames),hasP=CONFIG.photos.length;
  $("main").innerHTML=`
  <section class="hero"><div id="hearts" aria-hidden="true"></div><div style="position:relative">
    <h1>${nm}</h1><div class="script" data-t="sub"></div>
    <p class="facts"><span data-t="dt"></span><br><span data-t="vn"></span></p>
    ${emblem}
    <div class="btns"><a class="btn" href="#events" data-t="cta"></a><a class="btn alt" data-t="save" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(CONFIG.coupleNames+" — Wedding")}&dates=${CONFIG.weddingDate.replace(/-/g,"")}/${CONFIG.weddingDate.replace(/-/g,"")}&location=${encodeURIComponent(CONFIG.venueName)}"></a></div>
  </div></section>
  ${sec("count",`<h2 id="count-h" data-t="cdT"></h2>${orn}<div class="cd card" id="cd" aria-hidden="true"></div><p class="plain" id="cdp" role="timer"></p><p class="plain" data-t="cdNote"></p>`)}
  ${sec("invite",`<h2 id="invite-h" data-t="scT"></h2>${orn}<p class="sub" data-t="scS"></p><div class="scratch" id="sc"><div class="under"><h3>${nm}</h3><p data-t="dt"></p><p data-t="vn"></p></div><canvas aria-hidden="true"></canvas></div><div class="btns"><button class="btn alt" id="reveal" data-t="scBtn"></button></div>`)}
  ${sec("events",`<h2 id="events-h" data-t="evT"></h2>${orn}<p class="sub" data-t="evS"></p><div class="events" id="evg"></div>`)}
  ${hasP?sec("gallery",`<h2 id="gallery-h" data-t="gT"></h2>${orn}<div class="gal">${CONFIG.photos.map((p,i)=>`<img loading="lazy" data-i="${i}" src="${esc(p.src)}" alt="${esc(p.alt||"")}" tabindex="0">`).join("")}</div>`):""}
  ${CONFIG.hashtag?sec("hashtag",`<h2 id="hashtag-h" data-t="hT"></h2>${orn}<div class="hash">${esc(CONFIG.hashtag)}</div><div class="center"><button class="btn" id="cp" data-t="copy"></button></div>`):""}
  <footer><span class="script" style="font-size:2rem" data-t="thT"></span><p data-t="th"></p><a class="btn alt" href="#top" data-t="top"></a><p style="font-size:.85rem;color:var(--muted)">${nm}</p></footer>`;
  hearts();scratch();bind();applyLang();
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t(el.dataset.t)});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("#menu").setAttribute("aria-label",t("menu"));
  $("#evg").innerHTML=active().map(card).join("");
  $("#links").innerHTML=`<a href="#top">${t("nHome")}</a><a href="#events">${t("nEvents")}</a>`+active().map(([k,e])=>`<a href="#${k}">${k==="other"?esc(f(e,"name")):t(NAVK[k]||"nEvents")}</a>`).join("");
  tick();
}
function hearts(){const h=$("#hearts");for(let i=0;i<9;i++){const e=document.createElement("span");e.className="heart";e.textContent="♥";e.style.cssText=`left:${5+i*11}%;font-size:${14+(i%3)*8}px;animation-duration:${14+(i%4)*4}s;animation-delay:${-i*2.3}s`;h.appendChild(e)}}
function target(){return new Date(`${CONFIG.weddingDate}T${CONFIG.weddingTime||"00:00:00"}${CONFIG.timezoneOffset}`).getTime()}
let timer;
function tick(){
  clearInterval(timer);
  const go=()=>{const d=Math.max(0,target()-Date.now()),S=Math.floor(d/1000),D=Math.floor(S/86400),H=Math.floor(S%86400/3600),M=Math.floor(S%3600/60),X=S%60;
    $("#cd").innerHTML=[[D,"d"],[H,"h"],[M,"m"],[X,"s"]].map(([v,k])=>`<div><b>${String(v).padStart(2,"0")}</b><span>${t(k)}</span></div>`).join("");
    $("#cdp").textContent=d===0?t("cdDone"):(lang==="kn"?`${D} ${t("d")}, ${H} ${t("h")}, ${M} ${t("m")}`:`${D} days, ${H} hours, ${M} minutes`);};
  go();timer=setInterval(go,1000);
}
function scratch(){
  const box=$("#sc"),cv=$("canvas",box),ctx=cv.getContext("2d");let drawing=false,moves=0,done=false;
  const size=()=>{const r=box.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const g=ctx.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,"#d9bd7c");g.addColorStop(.5,"#f1dfae");g.addColorStop(1,"#b99349");ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);
    ctx.fillStyle="rgba(80,55,73,.35)";ctx.font="28px serif";ctx.textAlign="center";ctx.fillText("✦  ♥  ✦",r.width/2,r.height/2+8);ctx.globalCompositeOperation="destination-out"};
  size();new ResizeObserver(()=>{if(!done&&!moves)size()}).observe(box);
  const dot=e=>{const r=cv.getBoundingClientRect();ctx.beginPath();ctx.arc(e.clientX-r.left,e.clientY-r.top,22,0,7);ctx.fill();if(++moves%8===0)check()};
  const check=()=>{const d=ctx.getImageData(0,0,cv.width,cv.height).data;let c=0,n=0;for(let i=3;i<d.length;i+=64){n++;if(d[i]<128)c++}if(c/n>=CONFIG.scratchThreshold)finish()};
  const finish=()=>{done=true;box.classList.add("done")};
  cv.addEventListener("pointerdown",e=>{drawing=true;cv.setPointerCapture(e.pointerId);dot(e)});
  cv.addEventListener("pointermove",e=>{if(drawing)dot(e)});
  ["pointerup","pointercancel"].forEach(n=>cv.addEventListener(n,()=>{drawing=false;if(!done)check()}));
  $("#reveal").onclick=finish;
}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function bind(){
  const cp=$("#cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(CONFIG.hashtag);toast(t("copied"))}catch(e){toast(CONFIG.hashtag)}};
  let idx=0;const lb=$("#lb"),open=i=>{const p=CONFIG.photos[idx=(i+CONFIG.photos.length)%CONFIG.photos.length];$("#lbi").src=p.src;$("#lbi").alt=p.alt||"";$("#lbc").textContent=p.caption||"";lb.classList.add("on");$("#lbx").focus()};
  document.querySelectorAll(".gal img").forEach(im=>{im.onclick=()=>open(+im.dataset.i);im.onkeydown=e=>{if(e.key==="Enter")open(+im.dataset.i)}});
  $("#lbx").onclick=()=>lb.classList.remove("on");$("#lbp").onclick=()=>open(idx-1);$("#lbn").onclick=()=>open(idx+1);
  let sx=0;lb.ontouchstart=e=>sx=e.touches[0].clientX;lb.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)open(idx+(dx<0?1:-1))};
}
document.addEventListener("keydown",e=>{const lb=$("#lb");if(!lb.classList.contains("on"))return;if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowRight")$("#lbn").click();if(e.key==="ArrowLeft")$("#lbp").click()});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}applyLang()});
$("#menu").onclick=()=>{const o=$("#links").classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)};
$("#links").onclick=e=>{if(e.target.tagName==="A"){$("#links").classList.remove("open");$("#menu").setAttribute("aria-expanded","false")}};
build();
</script>
</body>
